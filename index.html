<!doctype html>
<html lang="kha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreams Without Limits</title>
<meta name="description" content="Dreams Without Limits — a Khasi poem by Balinda Jyrwa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3e3c3; --ink: #3b2716; --muted: #7c5f43; --accent: #8f2f17;
    --gold: #b68a3e; --gold-soft: rgba(182,138,62,.45);
    --band: 12px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; color: var(--ink); overflow-x: hidden;
    font-family: "Cormorant Garamond", Georgia, serif;
    background: var(--paper) url("img/paper.jpg") center / cover fixed;
  }
  img { display: block; user-select: none; -webkit-user-drag: none; }
  .layer { position: absolute; pointer-events: none; will-change: transform; }

  /* ---------- fixed frame ---------- */
  .band { position: fixed; left: 0; right: 0; height: var(--band); z-index: 50;
    background: url("img/weave.webp") repeat-x left center / auto 100%;
    box-shadow: 0 0 12px rgba(60,30,10,.35); }
  .band.top { top: 0; } .band.bottom { bottom: 0; }
  .progress { position: fixed; top: var(--band); left: 0; height: 2px; width: 100%; z-index: 51;
    background: linear-gradient(90deg, transparent, var(--gold) 20%, #e7c27a 50%, var(--gold) 80%, transparent);
    transform-origin: left; transform: scaleX(0); }

  /* ---------- hero ---------- */
  .hero { position: relative; z-index: 4; height: 100vh; min-height: 620px; overflow: hidden; }
  .valley-wrap { position: absolute; left: -3%; right: -3%; bottom: -2%; height: 74vh; will-change: transform;
    -webkit-mask-image: linear-gradient(transparent 0%, rgba(0,0,0,.55) 14%, #000 34%);
            mask-image: linear-gradient(transparent 0%, rgba(0,0,0,.55) 14%, #000 34%); }
  .valley { width: 100%; height: 100%; object-fit: cover; object-position: 60% 78%;
    filter: blur(var(--vblur, 1.4px)) saturate(1.05); transform: scale(1.03); }
  .perch { position: absolute; left: -3vw; bottom: -40px; width: min(35vw, 680px); z-index: 2; aspect-ratio: 1165 / 683; will-change: transform; }
  .perch .hill { position: absolute; inset: auto 0 0 0; width: 100%; }
  .perch::before { content: ""; position: absolute; left: 10%; bottom: 40%; width: 34%; height: 9%; z-index: 1;
    background: radial-gradient(ellipse, rgba(30,15,5,.55), transparent 70%); filter: blur(4px); }
  .perch .girl { position: absolute; left: 4%; bottom: 20%; width: 46%; z-index: 2;
    filter: drop-shadow(0 6px 8px rgba(40,20,5,.35)); }
  .blossom { top: -2.5vw; left: -3vw; width: 25vw; max-width: 480px; z-index: 3;
    filter: drop-shadow(0 10px 16px rgba(60,30,10,.25)); }
  .blossom.r { left: auto; right: -3vw; top: -3vw; width: 17vw; scale: -1 1; opacity: .95; }
  .hero-shade { position: absolute; inset: auto 0 0 0; height: 22%; z-index: 1;
    background: linear-gradient(transparent, rgba(40,25,10,.4)); pointer-events: none; }
  .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at 50% 30%, transparent 55%, rgba(90,55,20,.18)); }

  .title-wrap { position: absolute; top: 11vh; left: 0; right: 0; text-align: center; padding: 0 16px; z-index: 3; }
  .eyebrow { font-family: "Cinzel", serif; letter-spacing: .5em; font-size: clamp(.7rem, 1vw, .85rem);
    color: var(--muted); padding-left: .5em; }
  h1 { margin: 14px 0 10px; font-weight: 700; line-height: .95; color: var(--accent);
    font-size: clamp(3rem, 6.4vw, 6.6rem); letter-spacing: -.01em;
    text-shadow: 0 0 40px rgba(255,240,210,.95), 0 2px 2px rgba(255,240,210,.8); }
  h1 em { display: block; font-weight: 500; font-size: .5em; color: var(--ink); letter-spacing: .02em; }
  .byline { text-shadow: 0 0 18px rgba(255,240,210,1), 0 0 6px rgba(255,240,210,1); font-style: italic; font-size: clamp(1.1rem, 1.6vw, 1.4rem); color: var(--muted); }
  .rule { width: 180px; height: 1px; margin: 22px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); position: relative; }
  .rule::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px;
    background: var(--gold); transform: translate(-50%, -50%) rotate(45deg); }

  .scroll-hint { position: absolute; bottom: 34px; left: 50%; z-index: 4; transform: translateX(-50%);
    font-family: "Cinzel", serif; font-size: .7rem; letter-spacing: .35em; color: #fff4dc;
    text-shadow: 0 1px 6px rgba(0,0,0,.5); text-align: center; text-decoration: none; }
  .scroll-hint span { display: block; width: 1px; height: 38px; margin: 10px auto 0;
    background: linear-gradient(#fff4dc, transparent); animation: drip 2.2s ease-in-out infinite; transform-origin: top; }
  @keyframes drip { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

  .weave-divider { height: 44px; position: relative; z-index: 5;
    background: url("img/weave.webp") repeat-x 0 center / auto 100%;
    box-shadow: 0 6px 18px rgba(60,30,10,.3), 0 -6px 18px rgba(60,30,10,.3); }

  /* ---------- poem ---------- */
  .poem-section { position: relative; padding: 110px 16px 60px; }
  .intro { text-align: center; max-width: 560px; margin: 0 auto 30px; }
  .intro .eyebrow { display: block; margin-bottom: 10px; }
  .intro h2 { margin: 0; font-weight: 600; font-size: clamp(2rem, 4vw, 2.8rem); color: var(--accent); }

  main { position: relative; z-index: 2; max-width: 620px; margin: 0 auto; }
  .stanza { text-align: center; padding: 30px 0;
    opacity: 0; transform: translateY(30px); filter: blur(5px);
    transition: opacity 1s ease, transform 1s cubic-bezier(.2,.7,.2,1), filter 1s ease; }
  .stanza.show { opacity: 1; transform: none; filter: none; }
  .stanza p { margin: 0; white-space: pre-line; font-weight: 500;
    font-size: clamp(1.25rem, 1.7vw, 1.5rem); line-height: 1.75; }
  .stanza::after { content: "❦"; display: block; margin-top: 30px; color: var(--gold); font-size: 1.1rem; opacity: .8; }
  .stanza:last-child::after { content: none; }

  /* pinned ornaments + drifting art in the side margins */
  .side-art { position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0; transition: opacity .9s ease; }
  .side-art.on { opacity: 1; }
  .side-art .orn { position: absolute; top: 50%; height: 70vh; width: auto; translate: 0 -50%; opacity: .9; }
  .side-art .orn.l { left: calc(50% - 400px); }
  .side-art .orn.r { right: calc(50% - 400px); }
  .side-art .drift { position: absolute; will-change: transform; }
  .side-art .d1 { top: 6vh; right: 0; width: min(calc(50vw - 440px), 520px); scale: -1 1;
    filter: drop-shadow(0 10px 14px rgba(60,30,10,.2)); }
  .side-art .d2 { filter: blur(1.6px); bottom: 4vh; left: 2vw; width: min(calc(50vw - 460px), 560px); opacity: .85;
    -webkit-mask-image: linear-gradient(90deg, #000 70%, transparent); mask-image: linear-gradient(90deg, #000 70%, transparent); }

  .petals { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .petal { position: absolute; top: -30px; width: 13px; height: 9px; border-radius: 80% 0 80% 0;
    background: linear-gradient(135deg, #fbd3cd, #e88f86); opacity: .8;
    animation: fall linear infinite; }
  .petal.leaf { background: linear-gradient(135deg, #b5cf6f, #557f2e); border-radius: 0 80% 0 80%; width: 15px; height: 8px; }

  /* petals and leaves thrown off by the mouse */
  .burst { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
  .flake { position: absolute; border-radius: 80% 0 80% 0; will-change: transform, opacity;
    background: linear-gradient(135deg, #fde0da, #ea8e86); box-shadow: 0 2px 4px rgba(80,30,20,.15); }
  .flake.leaf { border-radius: 0 80% 0 80%; background: linear-gradient(135deg, #c3d97c, #4e7a2a); }
  .flake.leaf::after { content: ""; position: absolute; left: 15%; right: 15%; top: 50%; height: 1px;
    background: rgba(40,60,20,.45); transform: rotate(-28deg); }

  @keyframes fall { to { transform: translate(var(--drift), 112vh) rotate(600deg); } }

  /* ---------- finale ---------- */
  .finale { position: relative; text-align: center; padding: 60px 16px 0; overflow: hidden; }
  .finale .credit { position: relative; z-index: 2; }
  .finale .credit .eyebrow { display: block; }
  .finale .name { font-weight: 700; font-size: clamp(2.6rem, 5vw, 4rem); color: var(--accent); margin: 8px 0 0; }
  .finale .thanks { font-style: italic; font-size: 1.4rem; color: var(--muted); margin: 4px 0 0; }
  .finale .ink { position: relative; width: min(1100px, 100%); margin: 30px auto 0; will-change: transform; }
  .finale .weave-divider { margin-top: -6px; }
  .end-space { height: var(--band); }

  /* ---------- small screens ---------- */
  @media (max-width: 1100px) { .side-art .drift { display: none; } }
  @media (max-width: 900px) { .side-art { display: none; } }
  @media (max-width: 700px) {
    :root { --band: 8px; }
    .hero { min-height: 620px; }
    .valley-wrap { height: 72%; left: -8%; right: -8%; }
    .valley { object-position: 70% 70%; }
    .perch { width: 118vw; left: -16vw; bottom: -6vw; }
    .perch::before { bottom: 41%; }
    .blossom { width: 60vw; top: -4vw; left: -8vw; }
    .blossom.r { display: block; width: 38vw; right: -8vw; top: -6vw; }
    .title-wrap { top: 15%; }
    h1 { font-size: clamp(3.4rem, 17vw, 4.6rem); }
    .byline { font-size: 1.1rem; }
    .scroll-hint { left: auto; right: 78px; bottom: 30px; transform: none; animation: none; }
    .weave-divider { height: 26px; }
    .poem-section { padding: 70px 22px 40px; }
  }

  /* ---------- download button ---------- */
  .pdf-btn { position: fixed; right: 22px; bottom: calc(var(--band) + 18px); z-index: 70;
    display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px 12px 16px;
    font: 600 .78rem/1 "Cinzel", serif; letter-spacing: .18em; color: #fff7e6; cursor: pointer;
    border: 1px solid rgba(255,230,180,.55); border-radius: 999px;
    background: linear-gradient(135deg, #a3401f, #7a2812);
    box-shadow: 0 8px 22px rgba(90,35,10,.35), inset 0 1px 0 rgba(255,255,255,.2);
    transition: transform .25s ease, box-shadow .25s ease; }
  .pdf-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(90,35,10,.45), inset 0 1px 0 rgba(255,255,255,.2); }
  .pdf-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .pdf-btn svg { width: 16px; height: 16px; }
  @media (max-width: 700px) {
    .pdf-btn { right: 14px; padding: 11px; } .pdf-btn span { display: none; }
    .pdf-btn svg { width: 20px; height: 20px; }
  }

  /* ---------- printable book (only used for the PDF) ---------- */
  #book { display: none; }
  @page { size: A4; margin: 0; }
  @media print {
    html, body { background: #f3e3c3 !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    body > *:not(#book) { display: none !important; }
    #book { display: block; }
    .pg { position: relative; width: 210mm; height: 297mm; overflow: hidden; break-after: page;
      background: #f3e3c3 url("img/paper.jpg") center / cover; color: var(--ink); }
    .pg:last-child { break-after: auto; }
    .pg .weave { position: absolute; left: 0; right: 0; height: 7mm;
      background: url("img/weave.webp") repeat-x left center / auto 100%; }
    .pg .weave.t { top: 0; } .pg .weave.b { bottom: 0; }

    /* cover */
    .cv-valley { position: absolute; left: 0; right: 0; bottom: 7mm; height: 58%; width: 100%; object-fit: cover; object-position: 65% 75%;
      -webkit-mask-image: linear-gradient(transparent, #000 32%); mask-image: linear-gradient(transparent, #000 32%); }
    .cv-perch { position: absolute; left: -10mm; bottom: 2mm; width: 138mm; aspect-ratio: 1165 / 683; }
    .cv-perch .hill { position: absolute; left: 0; bottom: 0; width: 100%; }
    .cv-perch .girl { position: absolute; left: 4%; bottom: 20%; width: 46%; }
    .cv-blossom { position: absolute; top: 3mm; left: -8mm; width: 92mm; }
    .cv-blossom.r { left: auto; right: -10mm; width: 62mm; transform: scaleX(-1); }
    .cv-title { position: absolute; top: 62mm; left: 0; right: 0; text-align: center; }
    .cv-title .eyebrow { font-size: 9pt; }
    .cv-title h1 { font-size: 58pt; margin: 4mm 0 3mm; text-shadow: none; }
    .cv-title .byline { font-size: 14pt; text-shadow: none; }

    /* poem pages */
    .pp-head { position: absolute; top: 16mm; left: 0; right: 0; text-align: center; }
    .pp-head .eyebrow { font-size: 8pt; letter-spacing: .45em; }
    .pp-corner { position: absolute; top: 6mm; right: -8mm; width: 58mm; transform: scaleX(-1); opacity: .9; }
    .pp-orn { position: absolute; top: 50%; height: 150mm; transform: translateY(-50%); opacity: .55; }
    .pp-orn.l { left: 14mm; } .pp-orn.r { right: 14mm; }
    .pp-body { position: absolute; top: 34mm; bottom: 30mm; left: 40mm; right: 40mm;
      display: flex; flex-direction: column; justify-content: center; }
    .pp-body .st { text-align: center; white-space: pre-line; font-weight: 500; font-size: 13.5pt; line-height: 1.62; }
    .pp-body .st + .st::before { content: "❦"; display: block; color: var(--gold); font-size: 10pt; margin: 4.5mm 0; }
    .pp-foot { position: absolute; bottom: 14mm; left: 0; right: 0; text-align: center;
      font: 500 9pt "Cinzel", serif; letter-spacing: .3em; color: var(--muted); }

    /* closing page */
    .end-credit { position: absolute; top: 70mm; left: 0; right: 0; text-align: center; }
    .end-credit .name { font-size: 40pt; font-weight: 700; color: var(--accent); margin: 4mm 0 0; }
    .end-credit .thanks { font-style: italic; font-size: 16pt; color: var(--muted); margin: 2mm 0 0; }
    .end-ink { position: absolute; left: 12mm; right: 12mm; bottom: 14mm; width: calc(100% - 24mm); }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .petals, .scroll-hint span { display: none; }
    .stanza { transition: none; opacity: 1; transform: none; filter: none; }
  }
</style>
</head>
<body>
<div class="band top"></div><div class="band bottom"></div>
<div class="progress" id="progress"></div>
<div class="petals" id="petals"></div>

<!-- Opening scene, built from separate layers -->
<header class="hero" id="top">
  <div class="valley-wrap" data-speed="0.38" data-depth="18"><img class="valley" src="img/valley.webp" alt=""></div>
  <div class="title-wrap" data-speed="0.6" data-fade data-depth="-8">
    <div class="eyebrow">THEME</div>
    <h1>Dreams<em>without Limits</em></h1>
    <div class="byline">a poem by Balinda Jyrwa</div>
    <div class="rule"></div>
  </div>
  <div class="perch" data-speed="0" data-depth="34">
    <img class="hill" src="img/hill.webp" alt="">
    <img class="girl" src="img/girl.webp" alt="A girl in traditional Khasi dress sitting on a hill, watching the sunrise">
  </div>
  <img class="layer blossom" data-speed="-0.45" data-depth="46" src="img/blossom.webp" alt="">
  <img class="layer blossom r" data-speed="-0.6" data-depth="40" src="img/blossom.webp" alt="">
  <div class="hero-shade"></div>
  <a class="scroll-hint" href="#poem">READ<span></span></a>
</header>

<div class="weave-divider" data-weave="0.3"></div>

<!-- Ornaments that stay beside the poem -->
<div class="side-art" id="sideArt" aria-hidden="true">
  <img class="drift d1" data-range="-260" src="img/blossom.webp" alt="">
  <img class="drift d2" data-range="200" src="img/ink-mountains.webp" alt="">
  <img class="orn l" src="img/ornament.webp" alt="">
  <img class="orn r" src="img/ornament.webp" alt="">
</div>

<section class="poem-section" id="poem">
  <div class="intro">
    <span class="eyebrow">KA POEM</span>
    <h2>Dreams Without Limits</h2>
    <div class="rule"></div>
  </div>
  <main id="stanzas"></main>
</section>

<footer class="finale" id="finale">
  <div class="credit">
    <span class="eyebrow">LA THOH BAD PYNWANDUR DA</span>
    <p class="name">Balinda Jyrwa</p>
    <p class="thanks">Khublei shibun</p>
    <div class="rule"></div>
  </div>
  <img class="ink" id="ink" src="img/ink-mountains.webp" alt="Mountains, a river and a golden sun">
  <div class="weave-divider" data-weave="-0.3"></div>
  <div class="end-space"></div>
</footer>

<button class="pdf-btn" id="pdfBtn" type="button" aria-label="Download as PDF">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
  <span>DOWNLOAD PDF</span>
</button>
<div id="book" aria-hidden="true"></div>

<script>
const stanzas = [
`Banyngkong eh, nga da sngewnguh,
Jinglong kyrpang, B'u Blei u buh.
Ha jinglongbriew, ym lah sngewthuh,
Jingjm kordor, kein ban shu duh.`,
`Kat shaba phai, dap tang jingma,
Wat la ha ing, ne ki para.
Ka suk, ka sain, ym i don shuh,
Palei mynsiem, te ka la duh`,
`Ko khun tipnong, ko tipni,
Wat shah jingsniew, kin teh ia phi.
Ka jingitieng, Ah! Tang ban peit,
Ka jingjylli, kat shaba leit.`,
`Nga kren kyrpang, ia ki kynthei,
Phi ruh te khun, phi don lawei.
Wat tieng, wat riej, bym don lynti,
Pynban to long, nuksa ia ki.`,
`Kat shaba phai, tang jingkhanglad,
Khamtam kynthei, ban plie, hap wad.
Ha shnong, ha thaw, ki bein, ki khoh,
Hi, kum katei, shaei kan ioh.`,
`Wat duh mynsiem, wat kynrandien,
To thom naphang, khlem jingsheptieng.
To shim jingtim, kum jingkyrkhu,
Namar phi tip, U don Ma U.`,
`Katie ka thong, nga buh hakhmat,
Ngam tieng wat ia, umbah ngan rat.
Ka thong te dei, ka thong Jong nga,
Ban poi shatei, hap jop ka thma.`,
`Bun ki samla, kynthei shisha,
La shah pynbor, ha ka shongkha.
Bapli ki kwah, ban im laitluid,
Khlem da pynbor, ki kwah im khun.`,
`Kane ka dei, ka por mynta,
Ban ieng rasong, khlem jingsalia.
Tylli kawei, ngin ia ieng lang,
Ko khun samla, kynthei, shynrang.`,
`Ba ngin shu sngap, te ka ba ma,
To pyni noh, da ka nuksa.
La ha ka ktien, ne ha ka kam,
To mait shaphrang, kum nongialam.`,
`Wat ong ba nga, te ngan ym lah,
Hynrei mynsiem, te ka da kwah.
To mih pyrthei, to sei ka sap,
Ngin rat diengkhoh, jingdum ngin kdat.`,
`Nga ruh i wei, na ki kynthei,
Ba ju angnud, ia ka lawei.
Nga sngew ba ka, long kaba eh,
Kat shaba phai, tang jingialeh.`,
`Khamtam lei lei, longing baduk,
Jynjar ban wad, ia ka jingsuk.
U shiah u thar, ha kti, ha kjat,
Teng teng, ngi jaw, ruh ki ummat.`,
`Naduh dang khie, haduh da dum,
Khrik, khrik, khrak, khrak, ka lang ka lum.
Bad ka pule, ha lang ka trei,
Namar kwah tip, ia ka lawei.`,
`Ko ri khasi, Baieid bathiang,
Ka por mynta, ia ngi la biang.
Ngin ai mynsiem, ba markylliang,
Namar jingstad, hi kan phalang.`,
`Kane ka dei, ka jingkyrsiew,
Kylleng pyrthei, ban ngam jylliew.
Ka hok, ka dei lang ia baroh,
Khlem thew shiliang, ne khlem pynnoh.`,
`Ym don bakhraw, lane batri,
Kynthei, shynrang, ruh kajuh hi.
Wat ong kynthei, ym tip ei ei,
Lah kut ha ing, ym don lawei.`,
`La dum ka buit, la dum ka stad,
Ha nga marwei, ba ngan pyrkhat,
Ba ngin peit poh, hi ia kiwei,
Khamtam lei lei, ia ki kynthei.`,
`Khunlung, khynnah, samla, rangbah,
Wat shah jingsniew, kin ker, kin kah.
Nga kren kyrpang, ia ki kynthei,
Namar nga ruh, nga dei i wei.`,
`Ko rang samla, rangbah ka ri,
Shongkha, shongman, kam shong ha phi.
Kan iaid lyngba, ar jingsngewthuh
Shijur kumba, U Blei U buh.`,
`Ah! Wat ia jrong ka kti, ka kjat,
Ngi don mynsiem, ym kum ki mrad.
Akor burom, hi kaba tam,
Sha kliar u lum, ryngkat ka nam.`,
`Longkmie, Longkpa, ko khun kynthei,
Ngi ruh ngi don te ka lawei.
I shiah in thar, un dung ia phi,
Ban poi sha kliar hap iaid lynti.`,
`Baroh baroh, ki ai mynsiem,
Samla kynthei, wat kynran dien.
Wat tieng, wat smiej, wat iam, wat ud,
Jingthrang Jong phi, te kam pat kut.`,
`Ko rang kynsai, samla ka ri,
Wat shah ba kin, jrong kti ia ki.
Phi long ka stieh bah, ban iada,
Khlem artatien, bad khlem salia.`,
`Ngi ruh ko thei, samla bhabriew,
Akor burom, hi kan kyntiew.
Ka nang ka stad, bad ka jingtip,
Kin neh shirta, bad kin ym lip.`,
`Haba phi thrang, bad phi angnud,
Ban long riewkhraw, bad bajymnud.
To shim ia jing-kitkhlieh, ha kti,
Ban poi sha thong, te dei ha phi.`,
`Satlak pyrthei, ki tip mynta,
Ba don ka bor, bad jingiada.
Ka jingpyntip, to kloi na phi,
Tang phi ba tip, ba iaid lynti.`,
`Ka jingpeit bein, ka jingpeit khoh,
Ka paw shai kdar, hangta baroh.
Phi ieng rangbah, phi ieng rasong,
Ka hok longbriew, kynmaw kundong.`,
`Nga ai khublei, ba kyrpang eh,
Wat la jingim, dei jingialeh.
Hynrei ban ieng, namar Jong phi,
Baroh ngin kit, bad ngin tylli.`,
`Kyntang ia wai, to ieng ryntih,
Namar Jong ki, ngi kloi ban mih.
Namar ka dei, kamram Jong ngi,
Ban jop donkam, jingiatylli.`
];

const holder = document.getElementById('stanzas');
stanzas.forEach(text => {
  const art = document.createElement('article');
  art.className = 'stanza';
  const p = document.createElement('p');
  p.textContent = text;
  art.appendChild(p);
  holder.appendChild(art);
});

// ---------- PDF: build a printable book, then open the save-as-PDF dialog ----------
const book = document.getElementById('book');
function buildBook() {
  if (book.childElementCount) return;
  const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const PER_PAGE = 5;
  const pages = [];
  for (let i = 0; i < stanzas.length; i += PER_PAGE) pages.push(stanzas.slice(i, i + PER_PAGE));
  let html = `
    <section class="pg">
      <div class="weave t"></div>
      <img class="cv-valley" src="img/valley.webp" alt="">
      <div class="cv-perch"><img class="hill" src="img/hill.webp" alt=""><img class="girl" src="img/girl.webp" alt=""></div>
      <img class="cv-blossom" src="img/blossom.webp" alt="">
      <img class="cv-blossom r" src="img/blossom.webp" alt="">
      <div class="cv-title">
        <div class="eyebrow">THEME</div>
        <h1>Dreams<em>without Limits</em></h1>
        <div class="byline">a poem by Balinda Jyrwa</div>
        <div class="rule"></div>
      </div>
      <div class="weave b"></div>
    </section>`;
  pages.forEach((group, n) => {
    html += `
    <section class="pg">
      <div class="weave t"></div>
      <img class="pp-corner" src="img/blossom.webp" alt="">
      <img class="pp-orn l" src="img/ornament.webp" alt="">
      <img class="pp-orn r" src="img/ornament.webp" alt="">
      <div class="pp-head"><div class="eyebrow">DREAMS WITHOUT LIMITS</div><div class="rule"></div></div>
      <div class="pp-body">${group.map(t => `<div class="st">${esc(t)}</div>`).join('')}</div>
      <div class="pp-foot">${n + 1}</div>
      <div class="weave b"></div>
    </section>`;
  });
  html += `
    <section class="pg">
      <div class="weave t"></div>
      <div class="end-credit">
        <div class="eyebrow">LA THOH BAD PYNWANDUR DA</div>
        <p class="name">Balinda Jyrwa</p>
        <p class="thanks">Khublei shibun</p>
        <div class="rule"></div>
      </div>
      <img class="end-ink" src="img/ink-mountains.webp" alt="">
      <div class="weave b"></div>
    </section>`;
  book.innerHTML = html;
}
addEventListener('beforeprint', buildBook);

document.getElementById('pdfBtn').addEventListener('click', async () => {
  buildBook();
  // wait for the book's images so none are missing from the PDF
  await Promise.all([...book.querySelectorAll('img')].map(img =>
    img.complete ? 0 : new Promise(r => { img.onload = img.onerror = r; })));
  await document.fonts.ready;
  const title = document.title;
  document.title = 'Dreams Without Limits - Balinda Jyrwa';   // becomes the PDF file name
  print();
  document.title = title;
});

const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('show'); io.unobserve(e.target); } });
}, { threshold: 0.2, rootMargin: '0px 0px -8% 0px' });
document.querySelectorAll('.stanza').forEach(el => io.observe(el));

const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

// falling petals, mostly in the margins
if (!still) {
  const petals = document.getElementById('petals');
  for (let i = 0; i < 24; i++) {
    const s = document.createElement('span');
    s.className = i % 3 === 0 ? 'petal leaf' : 'petal';
    s.style.left = (Math.random() < .5 ? Math.random() * 26 : 74 + Math.random() * 26) + 'vw';
    s.style.setProperty('--drift', (Math.random() * 180 - 90) + 'px');
    s.style.animationDuration = (13 + Math.random() * 14) + 's';
    s.style.animationDelay = (-Math.random() * 27) + 's';
    s.style.scale = .6 + Math.random() * .9;
    petals.appendChild(s);
  }
}

// parallax
const movers = [...document.querySelectorAll('[data-speed]')];
const valleyWrap = document.querySelector('.valley-wrap');
const weaves = [...document.querySelectorAll('[data-weave]')];
const sideArt = document.getElementById('sideArt');
const drifts = [...sideArt.querySelectorAll('.drift')];
const poem = document.getElementById('poem');
const ink = document.getElementById('ink');
const finale = document.getElementById('finale');
const progress = document.getElementById('progress');

// moving the mouse shakes loose petals and leaves; faster movement = more
const burst = document.createElement('div');
burst.className = 'burst';
document.body.appendChild(burst);
let lastX = null, lastY = 0, travelled = 0, alive = 0;
const STEP = 26, MAX = 90;
function spawnFlake(x, y, vx, vy) {
  const s = document.createElement('span');
  s.className = Math.random() < .45 ? 'flake leaf' : 'flake';
  const w = 9 + Math.random() * 11;
  s.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${w * .62}px`;
  burst.appendChild(s);
  alive++;
  const clamp = v => Math.max(-30, Math.min(30, v));
  const dx = clamp(vx) * 5 + (Math.random() - .5) * 220;
  const dy = 160 + Math.random() * 300 + clamp(vy) * 3;
  const spin = (Math.random() - .5) * 900;
  const anim = s.animate([
    { transform: 'translate(-50%,-50%) rotate(0deg) scale(.3)', opacity: 0 },
    { transform: `translate(calc(-50% + ${dx * .2}px), calc(-50% + ${dy * .06 - 20}px)) rotate(${spin * .15}deg) scale(1)`, opacity: .95, offset: .15 },
    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${spin}deg) scale(.85)`, opacity: 0 }
  ], { duration: 1900 + Math.random() * 1800, easing: 'cubic-bezier(.22,.6,.36,1)' });
  anim.onfinish = () => { s.remove(); alive--; };
}
function shake(x, y) {
  if (lastX === null) { lastX = x; lastY = y; return; }
  const vx = x - lastX, vy = y - lastY;
  lastX = x; lastY = y;
  travelled += Math.hypot(vx, vy);
  while (travelled > STEP) {
    travelled -= STEP;
    if (alive < MAX) spawnFlake(x + (Math.random() - .5) * 20, y + (Math.random() - .5) * 20, vx, vy);
  }
}
if (!still) {
  addEventListener('pointermove', e => { if (e.pointerType === 'mouse') shake(e.clientX, e.clientY); }, { passive: true });
  // on phones: a finger dragging (even while scrolling) drops leaves too
  addEventListener('touchstart', () => { lastX = null; }, { passive: true });
  addEventListener('touchmove', e => shake(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
}

// mouse depth: layers shift against the cursor, eased
let mx = 0, my = 0, cx = 0, cy = 0;
if (matchMedia('(hover: hover)').matches) addEventListener('pointermove', e => {
  mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5;
});

function tick() {
  const y = scrollY, vh = innerHeight;
  progress.style.transform = `scaleX(${y / (document.documentElement.scrollHeight - vh)})`;
  if (still) return;
  if (y < vh * 1.2) movers.forEach(el => {
    const d = +(el.dataset.depth || 0);
    el.style.transform = `translate(${-cx * d}px, ${y * el.dataset.speed - cy * d * .4}px)`;
    if ('fade' in el.dataset) el.style.opacity = Math.max(0, 1 - y / (vh * .55));
  });
  if (y < vh * 1.2) valleyWrap.style.setProperty('--vblur', (1.4 + Math.min(1, y / vh) * 6).toFixed(2) + 'px');
  weaves.forEach(el => el.style.backgroundPositionX = `${y * el.dataset.weave}px`);

  const start = poem.offsetTop - vh * .05;
  const poemTop = poem.getBoundingClientRect().top;
  const end = poem.offsetTop + poem.offsetHeight - vh * .75;
  const p = Math.min(1, Math.max(0, (y - start) / (end - start)));
  sideArt.classList.toggle('on', poemTop < vh * .1 && y < end);
  drifts.forEach(el => el.style.transform = `translateY(${(p - .5) * 2 * el.dataset.range}px)`);

  const f = finale.getBoundingClientRect().bottom - vh;
  ink.style.transform = `translateY(${Math.max(0, f) * .25}px)`;
}
// one continuous loop keeps scroll and mouse motion smooth
(function loop() {
  cx += (mx - cx) * .06; cy += (my - cy) * .06;
  tick();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
